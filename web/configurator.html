<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macropad C3 Configurator</title>
<meta name="description" content="Change what every key and the knob of your Macropad C3 do, from Chrome or Edge on Windows, macOS or Linux.">
<meta name="theme-color" content="#141518">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%23232428'/%3E%3Cg fill='%23f57a1f'%3E%3Crect x='7' y='7' width='5' height='5' rx='1'/%3E%3Crect x='13.5' y='7' width='5' height='5' rx='1'/%3E%3Crect x='20' y='7' width='5' height='5' rx='1'/%3E%3Crect x='7' y='13.5' width='5' height='5' rx='1'/%3E%3Crect x='13.5' y='13.5' width='5' height='5' rx='1'/%3E%3Crect x='20' y='13.5' width='5' height='5' rx='1'/%3E%3Crect x='7' y='20' width='5' height='5' rx='1'/%3E%3Crect x='13.5' y='20' width='5' height='5' rx='1'/%3E%3Crect x='20' y='20' width='5' height='5' rx='1'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=VT323&display=swap">
<style>
:root {
  --bg: #141518; --bg-2: #1b1c20; --card: #202227; --card-2: #26282e; --line: #2f3238; --line-2: #3a3d44;
  --fg: #ecebe8; --fg-2: #b4b3ae; --fg-3: #85847f;
  --accent: #f57a1f; --accent-2: #ff9a4d; --accent-ink: #1a0d03; --accent-soft: rgba(245,122,31,.12);
  --ok: #57c78a; --err: #ff6b5e; --oled: #050608; --oled-ink: #9fe2ff;
  --radius: 16px;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Space Grotesk", "Inter", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --pixel: "VT323", "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.55 var(--sans); padding-bottom: env(safe-area-inset-bottom, 0px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 31; }
a { color: var(--accent-2); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -.015em; margin: 0; text-wrap: balance; }
code, kbd { font-family: var(--mono); font-size: .86em; }
kbd { background: var(--card-2); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 6px; padding: .05em .4em; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.eyebrow { font: 600 .72rem/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--fg-3); }
[hidden] { display: none !important; }

nav.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(20,21,24,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
nav.top .wrap { display: flex; align-items: center; gap: 18px; height: 58px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 1rem var(--display); color: var(--fg); }
.brand:hover { text-decoration: none; }
.brand svg { width: 26px; height: 26px; }
.brand small { font: 500 .78rem var(--sans); color: var(--fg-3); }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: .9rem; }
.nav-right a { color: var(--fg-2); }
.lang { display: flex; border: 1px solid var(--line-2); border-radius: 999px; overflow: hidden; }
.lang button { background: none; border: 0; color: var(--fg-3); font: 600 .72rem var(--mono); padding: 6px 10px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
@media (max-width: 560px) { .brand small, .nav-right a { display: none; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 11px; font-weight: 600; font-size: .92rem; border: 1px solid transparent; cursor: pointer; background: var(--card-2); border-color: var(--line-2); color: var(--fg); transition: background .12s, border-color .12s, transform .12s; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--fg-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 17px; height: 17px; flex: none; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
.btn-sm { padding: 6px 10px; font-size: .82rem; border-radius: 9px; }
.btn-icon { padding: 7px; }
.btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* connection */
.conn { display: grid; grid-template-columns: 1fr auto; gap: 18px 28px; align-items: center; padding-block: 26px; }
.conn h1 { font-size: clamp(1.5rem, 3vw, 2rem); margin-top: 8px; }
.conn p { color: var(--fg-2); margin: 8px 0 0; max-width: 70ch; }
.conn-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.status { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; grid-column: 1 / -1; }
.pill { display: inline-flex; align-items: center; gap: 7px; font: 500 .8rem var(--mono); border: 1px solid var(--line-2); border-radius: 999px; padding: 5px 11px; color: var(--fg-2); background: var(--bg-2); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); }
.pill.live .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(87,199,138,.18); }
.pill.warn { border-color: rgba(255,107,94,.4); color: #ffb3ab; }
@media (max-width: 760px) { .conn { grid-template-columns: 1fr; } .conn-actions { justify-content: flex-start; } }

/* editor layout */
.editor { display: grid; grid-template-columns: 230px minmax(0, 1fr) 380px; gap: 18px; align-items: start; padding-bottom: 110px; }
@media (max-width: 1100px) { .editor { grid-template-columns: 210px minmax(0, 1fr); } .inspector { grid-column: 1 / -1; } }
@media (max-width: 720px) { .editor { grid-template-columns: 1fr; } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 10px; }
.panel-h h2 { font-size: .98rem; }

/* pages list */
.pages ol { list-style: none; margin: 0; padding: 0 8px 8px; display: grid; gap: 4px; }
.page-item { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: center; padding: 9px 10px; border-radius: 11px; cursor: pointer; border: 1px solid transparent; background: none; width: 100%; text-align: left; }
.page-item:hover { background: var(--card-2); }
.page-item.sel { background: var(--accent-soft); border-color: rgba(245,122,31,.4); }
.page-item .num { font: 600 .78rem var(--mono); color: var(--fg-3); }
.page-item.sel .num { color: var(--accent); }
.page-item b { display: block; font: 600 .92rem var(--display); }
.page-item span { font-size: .78rem; color: var(--fg-3); }
.page-item .ondev { color: var(--ok); }
.page-tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px 14px; border-top: 1px solid var(--line); }

/* center: device */
.center { display: grid; gap: 16px; min-width: 0; }
.page-name { display: flex; align-items: center; gap: 12px; padding: 14px 16px; flex-wrap: wrap; }
.page-name label { font: 600 .74rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); }
.txt { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 12px; min-width: 0; outline: none; }
.txt:focus { border-color: var(--accent); }
.page-name .txt { font: 600 1.05rem var(--display); width: 11ch; text-transform: uppercase; }
.counter { font: .75rem var(--mono); color: var(--fg-3); }
.stage { padding: 28px 18px; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #1f2126, var(--card) 70%); }
.device { width: min(100%, 390px); background: linear-gradient(160deg, #2c2e34, #222328); border-radius: 34px; padding: 24px; box-shadow: 0 30px 60px -22px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.06); border: 1px solid #34363d; }
.device-top { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }
.oled { flex: 1; aspect-ratio: 2 / 1; background: var(--oled); border-radius: 6px; border: 3px solid #0d0e11; padding: 5px 7px; font-family: var(--pixel); color: var(--oled-ink); display: grid; grid-template-rows: auto 1fr auto; gap: 3px; min-width: 0; }
.oled .hdr { display: flex; justify-content: space-between; gap: 6px; font-size: 14px; line-height: 1; white-space: nowrap; overflow: hidden; }
.oled .os { background: var(--oled-ink); color: var(--oled); padding: 0 3px; border-radius: 2px; }
.oled .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.oled .grid span { border: 1px solid var(--oled-ink); border-radius: 3px; font-size: 12.5px; line-height: 1.05; text-align: center; padding: 1px 0; overflow: hidden; white-space: nowrap; }
.oled .grid span.on { background: var(--oled-ink); color: var(--oled); }
.oled .grid span.empty { border-color: transparent; }
.oled .foot { text-align: center; font-size: 13px; line-height: 1; white-space: nowrap; overflow: hidden; }
.knob { width: 74px; height: 74px; flex: none; border-radius: 50%; border: 0; cursor: pointer; background: repeating-conic-gradient(from 0deg, #f57a1f 0 5deg, #d9600c 5deg 10deg); box-shadow: 0 6px 14px rgba(0,0,0,.5); position: relative; transition: transform .2s; }
.knob::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ff9a4d, #f57a1f 60%, #d9600c); }
.knob::before { content: ""; position: absolute; z-index: 1; left: 50%; top: 13px; width: 3px; height: 12px; margin-left: -1.5px; border-radius: 2px; background: rgba(26,13,3,.55); }
.knob.sel, .key.sel { outline: 3px solid var(--fg); outline-offset: 4px; }
.knob.pressed { transform: scale(.94); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.key { aspect-ratio: 1; border: 0; border-radius: 12px; cursor: pointer; background: linear-gradient(180deg, #ff8a35, #f57a1f); box-shadow: 0 5px 0 #b9520a, 0 9px 14px rgba(0,0,0,.45); color: var(--accent-ink); padding: 6px; display: grid; align-content: center; gap: 2px; min-width: 0; overflow: hidden; transition: transform .06s, box-shadow .06s; }
.key b { font: 700 .86rem var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.key small { font: 500 .66rem var(--mono); opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.key.empty { background: linear-gradient(180deg, #4a4c52, #3d3f45); box-shadow: 0 5px 0 #2a2b30, 0 9px 14px rgba(0,0,0,.45); color: var(--fg-3); }
.key.down { transform: translateY(4px); box-shadow: 0 1px 0 #b9520a, 0 3px 6px rgba(0,0,0,.4); }
.stage-hint { font-size: .82rem; color: var(--fg-3); margin-top: 14px; text-align: center; }

/* inspector */
.inspector { padding-bottom: 6px; }
.insp-body { padding: 4px 16px 16px; display: grid; gap: 16px; }
.field { display: grid; gap: 7px; }
.field > label, .field > .lbl { font: 600 .72rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { background: none; border: 0; padding: 6px 11px; border-radius: 8px; cursor: pointer; color: var(--fg-2); font-size: .85rem; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--card-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-2); }
select.txt { padding: 8px 10px; max-width: 100%; }
.combo { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.combo-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.combo-h b { font-size: .86rem; }
.combo-show { font: 600 .95rem var(--mono); color: var(--accent-2); min-height: 1.4em; }
.mods { display: flex; flex-wrap: wrap; gap: 6px; }
.mod { border: 1px solid var(--line-2); background: var(--card); border-radius: 8px; padding: 5px 9px; font: 600 .78rem var(--mono); cursor: pointer; color: var(--fg-2); }
.mod[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rec { border-color: rgba(245,122,31,.5); }
.rec.listening { background: var(--accent); color: var(--accent-ink); animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(245,122,31,.25); } }
.check { display: flex; align-items: center; gap: 9px; cursor: pointer; font-size: .9rem; color: var(--fg-2); }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.note { font-size: .8rem; color: var(--fg-3); }
.knob-dirs { display: grid; gap: 12px; }
.dir-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .9rem; }
.dir-title svg { width: 18px; height: 18px; color: var(--accent); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 2px 0; }

/* bottom bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: rgba(27,28,32,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.bar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 12px; flex-wrap: wrap; }
.bar .msg { font-size: .88rem; color: var(--fg-2); margin-right: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar .msg.ok { color: var(--ok); }
.bar .msg.err { color: var(--err); }
.dirty-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }

dialog { background: var(--card); color: var(--fg); border: 1px solid var(--line-2); border-radius: 20px; padding: 0; width: min(520px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.6); }
.dlg-h { padding: 20px 22px 6px; }
.dlg-b { padding: 10px 22px; display: grid; gap: 16px; }
.dlg-f { padding: 14px 22px 20px; display: flex; justify-content: flex-end; gap: 10px; }
.num-in { width: 7ch; }
.unsupported { margin-top: 10px; }
</style>
</head>
<body>

<nav class="top">
  <div class="wrap">
    <a class="brand" href="./">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="#26282e"/><g fill="#f57a1f"><rect x="7" y="7" width="5" height="5" rx="1"/><rect x="13.5" y="7" width="5" height="5" rx="1"/><rect x="20" y="7" width="5" height="5" rx="1"/><rect x="7" y="13.5" width="5" height="5" rx="1"/><rect x="13.5" y="13.5" width="5" height="5" rx="1"/><rect x="20" y="13.5" width="5" height="5" rx="1"/><rect x="7" y="20" width="5" height="5" rx="1"/><rect x="13.5" y="20" width="5" height="5" rx="1"/><rect x="20" y="20" width="5" height="5" rx="1"/></g></svg>
      <span>Macropad C3 <small data-t="configurator"></small></span>
    </a>
    <div class="nav-right">
      <a href="./" data-t="home"></a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-set-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-set-lang="it" aria-pressed="false">IT</button>
      </div>
    </div>
  </div>
</nav>

<div class="wrap">
  <section class="conn">
    <div>
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="title"></h1>
      <p data-t="intro"></p>
    </div>
    <div class="conn-actions">
      <button class="btn btn-primary" id="btn-usb" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v14M8 6l4-4 4 4M7 11v3a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-3"/><circle cx="12" cy="19" r="2"/></svg>
        <span data-t="connectUsb"></span>
      </button>
      <button class="btn" id="btn-ble" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
        <span data-t="connectBle"></span>
      </button>
      <button class="btn" id="btn-disc" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        <span data-t="disconnect"></span>
      </button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <main class="editor">
    <aside class="panel pages">
      <div class="panel-h"><h2 data-t="pages"></h2><span class="counter" id="page-count"></span></div>
      <ol id="page-list"></ol>
      <div class="page-tools">
        <button class="btn btn-sm" id="pg-add" type="button" data-t-title="addPage">＋ <span data-t="add"></span></button>
        <button class="btn btn-sm btn-icon" id="pg-up" type="button" data-t-title="moveUp" aria-label="up">↑</button>
        <button class="btn btn-sm btn-icon" id="pg-down" type="button" data-t-title="moveDown" aria-label="down">↓</button>
        <button class="btn btn-sm" id="pg-dup" type="button" data-t="duplicate"></button>
        <button class="btn btn-sm" id="pg-del" type="button" data-t="delete"></button>
      </div>
    </aside>

    <div class="center">
      <div class="panel page-name">
        <label for="page-name" data-t="pageName"></label>
        <input class="txt" id="page-name" maxlength="8" autocomplete="off" spellcheck="false">
        <span class="counter" id="page-name-count"></span>
        <span style="margin-left:auto" class="row">
          <button class="btn btn-sm" id="btn-test" type="button" disabled><span data-t="testKeys"></span></button>
          <button class="btn btn-sm" id="btn-settings" type="button"><span data-t="settings"></span></button>
        </span>
      </div>
      <div class="panel stage">
        <div class="device">
          <div class="device-top">
            <div class="oled" aria-hidden="true">
              <div class="hdr"><span id="o-page"></span><span class="os" id="o-os">MAC</span></div>
              <div class="grid" id="o-grid"></div>
              <div class="foot" id="o-foot"></div>
            </div>
            <button class="knob" id="knob" type="button" data-t-label="knob"></button>
          </div>
          <div class="keys" id="keys"></div>
        </div>
        <div class="stage-hint" data-t="stageHint"></div>
      </div>
    </div>

    <section class="panel inspector" id="inspector" aria-live="polite"></section>
  </main>
</div>

<div class="bar">
  <div class="wrap">
    <div class="msg" id="msg"></div>
    <button class="btn btn-sm" id="btn-open" type="button" data-t="openFile"></button>
    <button class="btn btn-sm" id="btn-save" type="button" data-t="saveFile"></button>
    <button class="btn btn-sm" id="btn-defaults" type="button" data-t="defaults"></button>
    <button class="btn btn-primary" id="btn-send" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
      <span data-t="send"></span>
    </button>
    <input type="file" id="file-in" accept=".json,application/json" hidden>
  </div>
</div>

<dialog id="dlg-settings">
  <form method="dialog">
    <div class="dlg-h"><h2 data-t="settings"></h2></div>
    <div class="dlg-b">
      <label class="check"><input type="checkbox" id="s-rev"> <span data-t="sRev"></span></label>
      <label class="check"><input type="checkbox" id="s-rot"> <span data-t="sRot"></span></label>
      <div class="field"><label for="s-steps" data-t="sSteps"></label>
        <select class="txt" id="s-steps"><option value="4">4</option><option value="2">2</option><option value="1">1</option><option value="3">3</option></select>
        <span class="note" data-t="sStepsNote"></span></div>
      <div class="field"><label for="s-disp" data-t="sDisp"></label>
        <div class="row"><input class="txt num-in" type="number" id="s-disp" min="0" max="3600"> <span class="muted" data-t="seconds"></span></div></div>

let rxJson = "", waiters = [];
function waitFor(types, ms = 4000) {
  return new Promise((resolve, reject) => {
    const w = { types, resolve, timer: setTimeout(() => { waiters = waiters.filter(x => x !== w); reject(new Error("timeout")); }, ms) };
    waiters.push(w);
  });
}
function handleMessage(type, body) {
  switch (type) {
    case "D": rxJson += body; break;
    case "E": { const j = rxJson; rxJson = ""; resolveWaiters("E", j); break; }
    case "S": try { status = JSON.parse(body); testing = status.test > 0; renderStatus(); renderPages(); renderDevice(); } catch (e) {} resolveWaiters("S", body); break;
    case "K": resolveWaiters("K"); break;
    case "X": resolveWaiters("X", body); break;
    case "A": resolveWaiters("A"); break;
    case "P": pressed.add(Number(body)); renderDevice(); break;
    case "R": pressed.delete(Number(body)); renderDevice(); break;
    case "C": $("knob").classList.toggle("pressed", body === "1"); break;
    case "T": { const k = $("knob"); const r = (Number(k.dataset.r || 0) + (Number(body) > 0 ? 18 : -18)); k.dataset.r = r; k.style.transform = `rotate(${r}deg)`; break; }
    case "N": if (status) status.page = Number(body); if (cfg.pages[Number(body)]) sel.page = Number(body); renderAll(); break;
  }
}
function resolveWaiters(type, value) {
  const hit = waiters.filter(w => w.types.includes(type));
  waiters = waiters.filter(w => !w.types.includes(type));
  hit.forEach(w => { clearTimeout(w.timer); w.resolve({ type, value }); });
}

// ----- USB (Web Serial): one line per message, "@" + type + text -----
async function connectUsb() {
  if (!("serial" in navigator)) { say(t("noSerial"), "err"); return; }
  let port;
  try { port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x303A }] }); } catch (e) { return; }
  try { await port.open({ baudRate: 115200 }); } catch (e) { say(e.message, "err"); return; }
  const enc = new TextEncoder();
  const writer = port.writable.getWriter();
  let reader = null, closed = false;
  const c = {
    kind: "usb",
    async write(type, payload = "") { await writer.write(enc.encode("@" + type + payload + "\n")); },
    async close() {
      closed = true;
      try { await writer.write(enc.encode("@Q\n")); } catch (e) {}
      try { await reader?.cancel(); } catch (e) {}
      try { writer.releaseLock(); } catch (e) {}
      try { await port.close(); } catch (e) {}
    },
  };
  (async () => {
    const dec = new TextDecoder(); let buf = "";
    try {
      while (port.readable && !closed) {
        reader = port.readable.getReader();
        try {
          for (;;) {
            const { value, done } = await reader.read(); if (done) break;
            buf += dec.decode(value, { stream: true });
            let i;
            while ((i = buf.indexOf("\n")) >= 0) {
              const line = buf.slice(0, i).replace(/\r$/, ""); buf = buf.slice(i + 1);
              if (line.startsWith("@") && line.length >= 2) handleMessage(line[1], line.slice(2));
            }
          }
        } finally { reader.releaseLock(); }
      }
    } catch (e) {}
    if (!closed) lostConnection();
  })();
  port.addEventListener?.("disconnect", () => { if (!closed) lostConnection(); });
  await startSession(c);
}

// ----- Bluetooth (Web Bluetooth): same messages, first byte = type -----
const SERVICE = "7a0b0001-5d1c-4b8e-9f3a-6d2c1e0a4b10", CTRL = "7a0b0002-5d1c-4b8e-9f3a-6d2c1e0a4b10";
async function connectBle() {
  if (!navigator.bluetooth) { say(t("noBle"), "err"); return; }
  let dev;
  say(t("bleHint"));
  try { dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }], optionalServices: [SERVICE] }); } catch (e) { barMsg = null; renderBar(); return; }
  try {
    const gatt = await dev.gatt.connect();
    const svc = await gatt.getPrimaryService(SERVICE);
    const ch = await svc.getCharacteristic(CTRL);
    const dec = new TextDecoder(); let closed = false;
    ch.addEventListener("characteristicvaluechanged", (ev) => {
      const v = new Uint8Array(ev.target.value.buffer); if (!v.length) return;
      const type = String.fromCharCode(v[0]);
      let body;
      if ("PRCN".includes(type)) body = String(v[1] ?? 0);
      else if (type === "T") body = String((v[1] ?? 0) > 127 ? v[1] - 256 : v[1]);
      else body = dec.decode(v.slice(1));
      handleMessage(type, body);
    });
    await ch.startNotifications();
    dev.addEventListener("gattserverdisconnected", () => { if (!closed) lostConnection(); });
    const enc = new TextEncoder();
    let queue = Promise.resolve();
    const c = {
      kind: "ble",
      write(type, payload = "") {
        let bytes;
        if (type === "M") bytes = new Uint8Array([77, Number(payload) || 0]);
        else { const p = enc.encode(payload); bytes = new Uint8Array(p.length + 1); bytes[0] = type.charCodeAt(0); bytes.set(p, 1); }
        queue = queue.then(() => ch.writeValueWithResponse(bytes));
        return queue;
      },
      async close() { closed = true; try { await ch.stopNotifications(); } catch (e) {} try { gatt.disconnect(); } catch (e) {} },
    };
    await startSession(c);
  } catch (e) { say(e.message, "err"); }
}

let statusTimer = null;
async function startSession(c) {
  conn = c; status = null; testing = false; renderStatus(); renderBar();
  // the USB may restart the macropad when the port opens: ask for the status until it answers
  let ok = false;
  for (let i = 0; i < 12 && !ok; i++) {
    try { await c.write("S"); await waitFor(["S"], 600); ok = true; } catch (e) {}
  }
  if (!ok) { say(t("noResponse"), "err"); await disconnect(true); return; }
  statusTimer = setInterval(() => conn && conn.write("S").catch(() => {}), 5000);
  if (dirty) { say(t("unsent")); renderAll(); return; }
  await readDevice();
}
async function readDevice() {
  if (!conn) return;
  say(t("reading"));
  try {
    rxJson = ""; await conn.write("G");
    const r = await waitFor(["E"], 8000);
    cfg = normalize(JSON.parse(r.value)); sel.page = Math.min(status?.page ?? 0, cfg.pages.length - 1);
    setDirty(false); say(t("readDone"), "ok"); renderAll();
  } catch (e) { say(t("noResponse"), "err"); }
}
async function sendConfig() {
  if (!conn) return;
  stopRecording();
  const json = JSON.stringify(cfg);
  say(t("sending"));
  $("btn-send").disabled = true;
  try {
    if (conn.kind === "usb") {
      await conn.write("B"); await waitFor(["A"]);
      for (let i = 0; i < json.length; i += 180) { await conn.write("D", json.slice(i, i + 180)); await waitFor(["A"]); }
      await conn.write("E");
    } else {
      await conn.write("B");
      // chunks on character boundaries so multi-byte letters aren't split across writes
      let i = 0;
      while (i < json.length) { let j = Math.min(json.length, i + 160); await conn.write("D", json.slice(i, j)); i = j; }
      await conn.write("E");
    }
    const r = await waitFor(["K", "X"], 8000);
    if (r.type === "K") { setDirty(false); say(t("sent"), "ok"); conn.write("S"); }
    else say(t("sendErr") + r.value, "err");
  } catch (e) { say(t("noResponse"), "err"); }
  renderBar();
}
async function disconnect(silent) {
  clearInterval(statusTimer);
  const c = conn; conn = null; status = null; testing = false; pressed.clear();
  if (c) await c.close();
  if (!silent) { barMsg = null; }
  renderAll();
}
function lostConnection() {
  if (!conn) return;
  clearInterval(statusTimer); conn = null; status = null; testing = false; pressed.clear();
  say(t("lost"), "err"); renderAll();
}
