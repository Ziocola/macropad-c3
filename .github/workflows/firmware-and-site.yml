# Builds the firmware on every push, publishes the website with the web flasher (GitHub Pages)
# and, for tags like v1.2, attaches the binaries to a GitHub release.
name: Firmware & website

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        working-directory: firmware
        run: pio run

      - name: Read firmware version
        id: ver
        run: echo "version=$(grep -oP 'FW_VERSION "\K[^"]+' firmware/src/app_link.cpp)" >> "$GITHUB_OUTPUT"

      - name: Prepare binaries and website
        run: |
          B=firmware/.pio/build/supermini
          mkdir -p dist site/firmware
          cp "$B/firmware.factory.bin" dist/macropad-c3-${{ steps.ver.outputs.version }}-full.bin
          cp "$B/firmware.bin"         dist/macropad-c3-${{ steps.ver.outputs.version }}-app.bin
          cp -R web/. site/
          cp "$B/firmware.factory.bin" site/firmware/macropad-c3.bin
          python3 - <<'EOF'
          import json
          m = json.load(open("site/manifest.json"))
          m["version"] = "${{ steps.ver.outputs.version }}"
          json.dump(m, open("site/manifest.json", "w"), indent=2)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.ver.outputs.version }}
          path: dist/

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

      - name: Attach binaries to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
